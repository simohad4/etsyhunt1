<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Ensure window.fetch is writable and configurable so browser extensions/interceptors can patch it safely
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if defineProperty fails
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etsy Hunter</title>
    <meta name="description" content="Etsy product research and market intelligence tool. Evaluate niches, inspect candidate tags, analyze observed marketplace signals, and model demand metrics." />

    <meta name="author" content="Etsy Hunter" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark" />
