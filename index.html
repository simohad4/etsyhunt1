    <script>
      // Ensure window.fetch is writable and configurable so browser extensions/interceptors can patch it safely
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if defineProperty fails
        }
      })();
    </script>
